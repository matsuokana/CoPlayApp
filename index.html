<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>共奏 3 - CoPlay</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ホーム画面 -->
  <div id="screen-home" class="screen active">
    <div class="home-bg">
      <div class="notes-bg" aria-hidden="true">
        <span class="note" style="top:3%;left:6%;color:#FF4444;font-size:1.8rem;transform:rotate(-20deg)">♪</span>
        <span class="note" style="top:2%;left:30%;color:#FF8800;font-size:1.3rem;transform:rotate(10deg);animation-delay:.8s">♫</span>
        <span class="note" style="top:5%;left:58%;color:#FFDD00;font-size:1.6rem;transform:rotate(-5deg);animation-delay:1.6s">♪</span>
        <span class="note" style="top:2%;left:82%;color:#44CC44;font-size:1.4rem;transform:rotate(25deg);animation-delay:.4s">♬</span>
        <span class="note" style="top:12%;left:95%;color:#4488FF;font-size:1.8rem;transform:rotate(-15deg);animation-delay:2s">♫</span>
        <span class="note" style="top:22%;left:1%;color:#FF44AA;font-size:1.5rem;transform:rotate(-30deg);animation-delay:1.2s">♩</span>
        <span class="note" style="top:18%;left:18%;color:#AA44FF;font-size:1.2rem;transform:rotate(20deg);animation-delay:.6s">♪</span>
        <span class="note" style="top:16%;left:72%;color:#FF8800;font-size:1.7rem;transform:rotate(-10deg);animation-delay:2.4s">♬</span>
        <span class="note" style="top:30%;left:88%;color:#FFDD00;font-size:1.4rem;transform:rotate(30deg);animation-delay:1s">♪</span>
        <span class="note" style="top:38%;left:4%;color:#44CC44;font-size:1.6rem;transform:rotate(-25deg);animation-delay:1.8s">♫</span>
        <span class="note" style="top:42%;left:42%;color:#FF4444;font-size:1.3rem;transform:rotate(15deg);animation-delay:.3s">♪</span>
        <span class="note" style="top:50%;left:80%;color:#AA44FF;font-size:1.8rem;transform:rotate(-20deg);animation-delay:2.2s">♩</span>
        <span class="note" style="top:55%;left:22%;color:#4488FF;font-size:1.4rem;transform:rotate(5deg);animation-delay:.9s">♫</span>
        <span class="note" style="top:62%;left:60%;color:#FF44AA;font-size:1.5rem;transform:rotate(-15deg);animation-delay:1.5s">♪</span>
        <span class="note" style="top:68%;left:10%;color:#FF8800;font-size:1.9rem;transform:rotate(20deg);animation-delay:.2s">♬</span>
        <span class="note" style="top:72%;left:50%;color:#FFDD00;font-size:1.3rem;transform:rotate(-30deg);animation-delay:2.6s">♪</span>
        <span class="note" style="top:78%;left:82%;color:#44CC44;font-size:1.6rem;transform:rotate(10deg);animation-delay:1.4s">♫</span>
        <span class="note" style="top:85%;left:28%;color:#FF4444;font-size:1.4rem;transform:rotate(-5deg);animation-delay:.7s">♩</span>
        <span class="note" style="top:90%;left:65%;color:#AA44FF;font-size:1.8rem;transform:rotate(25deg);animation-delay:2.8s">♪</span>
        <span class="note" style="top:95%;left:42%;color:#4488FF;font-size:1.2rem;transform:rotate(-20deg);animation-delay:1.1s">♫</span>
      </div>
    </div>
    <div class="home-content">
      <h1 class="app-title">共奏 3</h1>
      <p class="app-subtitle">"あなた"と奏でる"未来"を紡ぐ</p>
      <div class="event-band">誰も眠らせない！参加型の新しいクラシックコンサート</div>
      <div class="home-buttons">
        <button class="home-btn btn-sound" id="btn-go-soundboard" aria-label="おとをならそう">
          <span class="btn-icon">🎵</span>
          <span class="btn-label">おとをならそう！</span>
        </button>
      </div>
    </div>
  </div>

  <!-- サウンドボード画面 -->
  <div id="screen-soundboard" class="screen">
    <header class="page-header">
      <button class="back-btn" id="btn-back-soundboard" aria-label="もどる">◀ もどる</button>
      <h2 class="page-title">🎵 おとをならそう！</h2>
    </header>
    <div class="soundboard-grid" id="soundboard-grid"></div>
    <div class="soundboard-footer">
      <button class="add-btn" id="btn-add-sound" aria-label="おとをついか">
        ＋ おとをついか
      </button>
    </div>
  </div>

  <!-- 録音画面 -->
  <div id="screen-record" class="screen">
    <header class="page-header">
      <button class="back-btn" id="btn-back-record" aria-label="もどる">◀ もどる</button>
      <h2 class="page-title">🎤 おとをろくおん</h2>
    </header>
    <div class="record-content">
      <div class="record-step">
        <p class="step-label">① アイコンをえらんでね</p>
        <div class="icon-picker" id="icon-picker"></div>
      </div>
      <div class="record-step">
        <p class="step-label">② なまえをいれてね</p>
        <input type="text" id="sound-name-input" class="name-input" maxlength="8" placeholder="れい：たいこ">
      </div>
      <div class="record-step">
        <p class="step-label">③ ろくおんしよう（さいだい10びょう）</p>
        <div class="record-controls">
          <button class="rec-btn" id="btn-rec-start" aria-label="ろくおんスタート">
            🔴 ろくおんスタート
          </button>
          <button class="rec-btn hidden" id="btn-rec-stop" aria-label="とめる">
            ⏹ とめる
          </button>
        </div>
        <div class="record-timer hidden" id="record-timer">0.0びょう</div>
        <button class="play-btn hidden" id="btn-rec-play" aria-label="さいせい">
          ▶ さいせい
        </button>
      </div>
      <button class="decide-btn hidden" id="btn-rec-decide" aria-label="このおとでけってい">
        🎉 このおとでけってい！
      </button>
    </div>
  </div>

  <!-- 長押しメニュー -->
  <div id="longpress-menu" class="longpress-menu hidden" role="dialog" aria-modal="true">
    <button id="btn-rename" class="menu-item">✏️ なまえをかえる</button>
    <button id="btn-delete" class="menu-item danger">🗑 けす</button>
    <button id="btn-menu-cancel" class="menu-item cancel">キャンセル</button>
  </div>
  <div id="menu-backdrop" class="menu-backdrop hidden"></div>

  <!-- 削除確認ダイアログ -->
  <div id="confirm-dialog" class="dialog hidden" role="alertdialog" aria-modal="true">
    <p class="dialog-msg">ほんとうにけしますか？</p>
    <div class="dialog-buttons">
      <button id="btn-confirm-yes" class="dialog-btn yes">けす</button>
      <button id="btn-confirm-no" class="dialog-btn no">やめる</button>
    </div>
  </div>
  <div id="dialog-backdrop" class="menu-backdrop hidden"></div>

  <!-- リネームダイアログ -->
  <div id="rename-dialog" class="dialog hidden" role="dialog" aria-modal="true">
    <p class="dialog-msg">あたらしいなまえ</p>
    <input type="text" id="rename-input" class="name-input" maxlength="8">
    <div class="dialog-buttons">
      <button id="btn-rename-ok" class="dialog-btn yes">けってい</button>
      <button id="btn-rename-cancel" class="dialog-btn no">キャンセル</button>
    </div>
  </div>
  <div id="rename-backdrop" class="menu-backdrop hidden"></div>

  <script src="js/storage.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/soundboard.js"></script>
  <script src="js/shakelight.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
